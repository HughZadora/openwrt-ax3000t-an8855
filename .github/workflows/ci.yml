name: CI - Build OpenWrt AX3000T-AN8855

on:
  push:
    branches: [master, openwrt-24.10]
  pull_request:
    branches: [master, openwrt-24.10]
  schedule:
    - cron: '0 2 1 * *'  # 02:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      branch:
        description: 'Repo branch (master = upstream main, or openwrt-24.10)'
        required: false
        default: 'master'
        type: choice
        options:
          - master
          - openwrt-24.10

env:
  OPENWRT_DIR: ${{ github.workspace }}/openwrt-ax3000t
  REPO_PATCH_DIR: ${{ github.workspace }}/patches
  OPENCLASH_URL: https://github.com/vernesong/OpenClash.git

jobs:
  build:
    name: Build (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write  # Required for VERIFIED_COMMIT auto-update push
    strategy:
      fail-fast: false
      # NOTE: `branch`/`artifact_prefix` use this repo's branch names.
      # Repo `master` tracks upstream OpenWrt `main` (upstream HEAD);
      # the Clone step resolves that mapping — never pass `branch`
      # verbatim to `git clone --branch` for upstream.
      matrix:
        include:
          - branch: master
            verified_commit_lock: true
            artifact_prefix: master
          - branch: openwrt-24.10
            verified_commit_lock: false
            artifact_prefix: openwrt-24.10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Needed for semantic-release and VERIFIED_COMMIT update
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up build branch
        if: >-
          github.event_name != 'schedule'
          && github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # For push, use the triggering branch; for pull_request, use the
          # target (base) branch — github.ref_name is '<pr>/merge' on PRs and
          # is not a valid upstream OpenWrt branch.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BUILD_BRANCH=$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "BUILD_BRANCH=$REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Set up build branch (scheduled/dispatch)
        if: >-
          github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          MATRIX_BRANCH: ${{ matrix.branch }}
        run: |
          # For scheduled/dispatch, use matrix or input
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "BUILD_BRANCH=$INPUT_BRANCH" >> "$GITHUB_ENV"
          else
            echo "BUILD_BRANCH=$MATRIX_BRANCH" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ccache jq

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set compression=true
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Prepare OpenWrt source
        env:
          # Contexts go through env (not interpolated into the shell) so the
          # run step stays free of template injection.
          VERIFIED_COMMIT_LOCK: ${{ matrix.verified_commit_lock }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # BUILD_BRANCH is this repo's branch name
          # (repo master -> upstream main).
          # Cloning, VERIFIED_COMMIT locking and patching live in
          # scripts/build/, shared with local `bash setup.sh`.
          if [ "$VERIFIED_COMMIT_LOCK" = "true" ] \
             && [ "$EVENT_NAME" != "pull_request" ]; then
            LOCK=--lock
          else
            LOCK=--no-lock
          fi
          bash scripts/build/prepare-source.sh \
            --branch "$BUILD_BRANCH" "$LOCK"

      - name: Apply an8855 patches (master only)
        if: ${{ matrix.verified_commit_lock }}
        run: bash scripts/build/apply-an8855-patches.sh --branch "$BUILD_BRANCH"

      - name: Configure feeds
        run: bash scripts/build/configure-feeds.sh

      - name: Configure build (seed .config)
        run: bash scripts/build/configure-config.sh

      - name: Inject first-boot defaults
        run: bash scripts/build/inject-firstboot-defaults.sh

      - name: Build firmware
        run: bash scripts/build/compile-firmware.sh

      - name: Validate image size
        run: bash scripts/build/report-artifacts.sh gate

      - name: Build OpenClash APK
        run: |
          bash scripts/build/compile-openclash-apk.sh
          APK_PATH=$(cat "$OPENWRT_DIR/.openclash-apk-path")
          echo "OPENCLASH_APK=$APK_PATH" >> "$GITHUB_ENV"
          echo "✅ OpenClash APK generated: $APK_PATH"

      - name: Collect artifacts
        env:
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          TARGET_DIR="$OPENWRT_DIR/bin/targets/mediatek/filogic"
          ARTIFACT_DIR="$RUNNER_TEMP/artifacts-$ARTIFACT_PREFIX"
          mkdir -p "$ARTIFACT_DIR"
          # Firmware images
          cp "$TARGET_DIR"/*-initramfs-factory.ubi "$ARTIFACT_DIR"/ \
            2>/dev/null || true
          cp "$TARGET_DIR"/*-squashfs-sysupgrade.bin "$ARTIFACT_DIR"/ \
            2>/dev/null || true
          # OpenClash APK (the package directory varies by OpenWrt feed/branch)
          if [ -n "${OPENCLASH_APK:-}" ] && [ -f "$OPENCLASH_APK" ]; then
            cp "$OPENCLASH_APK" "$ARTIFACT_DIR"/
          else
            echo "❌ OpenClash APK path is missing"
            exit 1
          fi
          # SHA256 sums
          (cd "$ARTIFACT_DIR" && sha256sum * > SHA256SUMS.txt) \
            2>/dev/null || true
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.artifact_prefix }}-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}/*
          retention-days: 90

      - name: Update VERIFIED_COMMIT (master, non-PR, success only)
        if: >-
          matrix.verified_commit_lock
          && github.event_name != 'pull_request'
        run: |
          bash scripts/update-verified-commit.sh \
            "$OPENWRT_DIR" "$REPO_PATCH_DIR"
