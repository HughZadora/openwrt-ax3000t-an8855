name: Release - semantic-release

on:
  workflow_run:
    workflows: [CI - Build OpenWrt AX3000T-AN8855]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Select source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Put source revision on master
        if: github.event_name == 'workflow_run'
        run: git checkout -B master "${{ steps.source.outputs.sha }}"

      - name: Download validated master artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: firmware-master-${{ github.event.workflow_run.head_sha }}
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release assets
        if: github.event_name == 'workflow_run'
        run: |
          set -eu
          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          factory_asset=$(find release-assets -maxdepth 1 -type f \
            -name '*-initramfs-factory.ubi' -print -quit)
          test -n "$factory_asset"
          squashfs_asset=$(find release-assets -maxdepth 1 -type f \
            -name '*-squashfs-sysupgrade.bin' -print -quit)
          test -n "$squashfs_asset"
          clash_asset=$(find release-assets -maxdepth 1 -type f \
            -name 'luci-app-openclash*.apk' -print -quit)
          test -n "$clash_asset"
          test -s release-assets/SHA256SUMS.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog \
            @semantic-release/git conventional-changelog-conventionalcommits

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: npx semantic-release --dry-run --no-ci

      - name: Run semantic-release
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Verify release
        if: github.event_name == 'workflow_run'
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          echo "Latest tag: $latest_tag"
